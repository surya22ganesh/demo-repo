apiVersion: apps/v1
kind: Deployment
metadata:
  name: relx-ang-deployment
  namespace: relx-test-ns
spec:
  replicas: 2 # tells deployment to run 2 pods matching the template
  selector:
    matchLabels:
      app: relxtestlabel
  template:
    metadata:
      labels:
        app: relxtestlabel
    spec:
      containers:
      - name: relx-ang-container
        image: surya22ganesh/relx-ang-test1 #need to change the image.
        ports:
        - containerPort: 80
apiVersion: v1
kind: Service
metadata:
  name: relx-test-np-service
spec:
  type: NodePort
  selector:
    # app.kubernetes.io/name: nginx
    app: relxtestlabel
  ports:
    - port: 80
      # By default and for convenience, the `targetPort` is set to
      # the same value as the `port` field.
      targetPort: 80  # container port no
      # Optional field
      # By default and for convenience, the Kubernetes control plane
      # will allocate a port from a range (default: 30000-32767)
      nodePort: 30008

# CHANGE THE SECURITY GROUP OF THE WORKER NODES.
# worker node server publicip:nodeport eg ) http://3.145.38.155:30008/        